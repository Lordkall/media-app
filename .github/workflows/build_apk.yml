name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.25.0"

      - name: Copy backend app models into frontend (required for packaging)
        run: cp -r backend/app backend/frontend/app

      - name: Build APK
        run: |
          cd backend/frontend
          flet build apk --project SaludNow --org com.saludnow.app -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaludNow-APK
          path: backend/frontend/build/apk/app-release.apk
          if-no-files-found: warn
