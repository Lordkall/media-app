name: Build Android APK (Flutter Native)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: |
          cd frontend_flutter
          flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | sed -E 's/-----BEGIN [^-]+-----//g; s/-----END [^-]+-----//g' \
            | tr -d '[:space:]' \
            | base64 --decode > frontend_flutter/android/app/upload-keystore.jks
          test -s frontend_flutter/android/app/upload-keystore.jks
          cat > frontend_flutter/android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD:-android}
          keyAlias=${ANDROID_KEY_ALIAS:-androiddebugkey}
          keyPassword=${ANDROID_KEY_PASSWORD:-android}
          EOF

      - name: Build APK
        run: |
          cd frontend_flutter
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaludNow-APK
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="saludnow-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            "frontend_flutter/build/app/outputs/flutter-apk/app-release.apk#SaludNow.apk" \
            --target "${{ github.sha }}" \
            --title "Salud Now $TAG" \
            --notes "Descarga directa de la aplicación Salud Now para Android." \
            --latest
