name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev mesa-utils

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=1.0.0"
          if [ -f backend/frontend/requirements.txt ]; then pip install -r backend/frontend/requirements.txt; fi

      - name: Build APK with Flet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIOUS_PYTHON_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend/frontend
          flet build apk --project SaludNow --org com.saludnow.app --yes -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: backend/frontend/build/apk/*.apk
