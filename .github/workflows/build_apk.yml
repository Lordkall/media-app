name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.25.0"

      - name: Copy backend app models into frontend (required for packaging)
        run: cp -r backend/app backend/frontend/app

      - name: Flet Pre-Build (generate Flutter project + package Python)
        run: |
          cd backend/frontend
          flet build apk --project SaludNow --org com.saludnow.app -v 2>&1 | tee /tmp/flet_build.log || true

      - name: Fix duplicate ic_launcher_background resource
        run: |
          DUPE="backend/frontend/build/flutter/android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$DUPE" ]; then
            rm -f "$DUPE"
            echo "✅ Removed duplicate ic_launcher_background.xml"
          else
            echo "❌ Flutter project was not generated. Flet build log (last 80 lines):"
            cat /tmp/flet_build.log | tail -80
            exit 1
          fi

      - name: Final Gradle Build
        env:
          # Required by serious_python Gradle plugin to locate packaged Python dependencies
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/backend/frontend/build/site-packages
        run: |
          cd backend/frontend/build/flutter
          flutter build apk --build-name 1.0.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaludNow-APK
          path: backend/frontend/build/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
