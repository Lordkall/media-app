name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev mesa-utils

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.1"
          if [ -f backend/frontend/requirements.txt ]; then pip install -r backend/frontend/requirements.txt; fi

      - name: Flet Pre-Build (generate Flutter project)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIOUS_PYTHON_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copiar la carpeta 'app' del backend dentro del frontend para empaquetar los modelos en el APK
          cp -r backend/app backend/frontend/app
          
          cd backend/frontend
          # Run flet build but allow it to fail at Gradle (it still generates the Flutter project)
          flet build apk --project SaludNow --org com.saludnow.app -v 2>&1 | tee /tmp/flet_build.log || true

      - name: Fix Duplicate Android Resources
        run: |
          # flutter_launcher_icons y flutter_native_splash generan colores duplicados
          # Eliminar ic_launcher_background.xml deja solo la definición en colors.xml
          DUPE="backend/frontend/build/flutter/android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$DUPE" ]; then
            rm -f "$DUPE"
            echo "Removed duplicate ic_launcher_background.xml"
          else
            echo "File not found, build may have failed before generating Flutter project"
            cat /tmp/flet_build.log | tail -50
            exit 1
          fi

      - name: Final Gradle Build
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/backend/frontend/build/site-packages
        run: |
          cd backend/frontend/build/flutter
          flutter build apk --build-name 1.0.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: backend/frontend/build/flutter/build/app/outputs/flutter-apk/*.apk

