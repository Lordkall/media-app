name: Build Android APK (Flutter Native)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: |
          cd frontend_flutter
          flutter pub get

      - name: Build APK
        run: |
          cd frontend_flutter
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaludNow-APK
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="saludnow-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            "frontend_flutter/build/app/outputs/flutter-apk/app-release.apk#SaludNow.apk" \
            --target "${{ github.sha }}" \
            --title "Salud Now $TAG" \
            --notes "Descarga directa de la aplicación Salud Now para Android." \
            --latest
