name: salud_now
description: "A new Flutter project for Salud Now."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  local_auth: ^2.2.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  table_calendar: ^3.2.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
